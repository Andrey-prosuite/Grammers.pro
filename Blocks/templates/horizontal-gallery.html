<section class="horizontal-gallery" data-horizontal-gallery data-gallery-mode="static" data-gallery-zoom="false" style="--gallery-gap: 24px; --gallery-padding: 40px; --gallery-radius: 16px;" aria-label="Галерея: static">
  <div class="horizontal-gallery__viewport" id="example-gallery-static" data-gallery-viewport tabindex="0" aria-label="Горизонтальная прокрутка изображений">
    <ul class="horizontal-gallery__track" data-gallery-track>
      <li class="horizontal-gallery__item" data-gallery-item>
        <img src="./images/case/brodeks/mobile-home.webp" width="323" height="607" alt="Главная страница Brodeks" loading="lazy" decoding="async">
      </li>
      <li class="horizontal-gallery__item" data-gallery-item>
        <img src="./images/case/brodeks/mobile-categories.webp" width="323" height="606" alt="Категории товаров Brodeks" loading="lazy" decoding="async">
      </li>
      <li class="horizontal-gallery__item" data-gallery-item>
        <img src="./images/case/brodeks/mobile-catalog.webp" width="323" height="606" alt="Каталог спецодежды Brodeks" loading="lazy" decoding="async">
      </li>
      <li class="horizontal-gallery__item" data-gallery-item>
        <img src="./images/case/brodeks/mobile-brand.webp" width="323" height="604" alt="Страница бренда Brodeks" loading="lazy" decoding="async">
      </li>
    </ul>
  </div>
</section>
